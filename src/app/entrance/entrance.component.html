<div class="d-flex flex-column align-items-center">
  <h2>抽號器</h2>
  <form class="row g-3 align-items-center">
    <div class="col-auto">
      <input #inputNum type="number" [(ngModel)]="inputValue" name="inputNum" class="form-control" min="2" placeholder="請輸入總人數">
    </div>
    <div class="col-auto">
      <button type="button" class="btn btn-primary grouping"
      [disabled]="!inputValue"
      (click)="submitNumber(inputNum.value)">送出</button>
    </div>
  </form>
</div>
