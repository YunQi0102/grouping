<form class="w-100 d-flex flex-column" style="height: calc(100vh - 110px);">
  <div class="row g-4 align-items-center">
    <div class="col-12">
      <h4 class="mb-0 text-center">請選擇總人數</h4>
    </div>
    <div class="col-12">
      <div class="number-buttons">
        <button *ngFor="let num of numbers" type="button" class="btn number-btn" [class.active]="inputValue === num"
          (click)="submitNumber(num)">
          {{ num }}
        </button>
      </div>
    </div>
  </div>
</form>
