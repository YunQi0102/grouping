<div class="d-flex justify-content-center align-items-center">
  <form class="w-100">
    <div class="row g-3 align-items-center">
      <div class="col-7 pe-0">
        <h4 class="mb-0 text-end">請輸入總人數：</h4>
      </div>
      <div class="col-5 ps-0">
        <input #inputNum type="number" [(ngModel)]="inputValue" name="inputNum" class="form-control" min="2"
          placeholder="例：12">
      </div>
    </div>

    <div class="d-flex flex-column align-items-center">
      <button type="button" class="btn btn-primary grouping mt-4" [disabled]="!inputValue || inputValue < 2"
        (click)="submitNumber(inputNum.value)">送出</button>

      <div class="modal fade" id="submitModal" tabindex="-1" aria-labelledby="submitModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content px-1">
            <div class="modal-header border-0 pb-0">
              <h5 class="modal-title" id="submitModalLabel">總人數不得大於20</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-footer border-0 d-flex justify-content-center g-3">
              <button type="button" class="btn btn-primary grouping" data-bs-dismiss="modal">確定</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
