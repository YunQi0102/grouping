<div class="d-flex flex-column align-items-center">
  <div class="d-flex flex-wrap justify-content-center gap-2">
    <span *ngFor="let num of getAllNumbers()" class="badge fs-6 bg-primary" [class.opacity-25]="!isDrawn(num)">
      {{ num }}
    </span>
  </div>

  <h1 [class]="{'my-5': totalNumber <= 16, 'my-4': totalNumber > 16}">你是 <span>{{ drawNum }}</span> 號</h1>
  <button type="button" class="btn btn-primary grouping circle" (click)="nextNumber()">
    {{ remainingCount > 0 ? '下一抽' : '結束' }}
  </button>
</div>
